[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsmaster"
version = "0.1.0"
description = "Python port of BUSMASTER CAN/LIN bus analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
dependencies = ["PySide6>=6.7"]

[project.scripts]
bsmaster = "bsmaster.gui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]
